services:
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    environment:
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-${DATABASE_URL:?请配置 DATABASE_URL}}
      BACKUP_DIRECTORY: /var/lib/blog-backups
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_TIMEOUT_SECONDS: ${BACKUP_TIMEOUT_SECONDS:-900}
      BACKUP_OSS_BUCKET: ${BACKUP_OSS_BUCKET:-}
      BACKUP_OSS_REGION: ${BACKUP_OSS_REGION:-}
      BACKUP_OSS_PREFIX: ${BACKUP_OSS_PREFIX:-blog-database}
      BACKUP_OSS_ACCESS_KEY_ID: ${BACKUP_OSS_ACCESS_KEY_ID:-}
      BACKUP_OSS_ACCESS_KEY_SECRET: ${BACKUP_OSS_ACCESS_KEY_SECRET:-}
      BACKUP_OSS_STS_TOKEN: ${BACKUP_OSS_STS_TOKEN:-}
    volumes:
      - blog_backups:/var/lib/blog-backups
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--import",
          "tsx",
          "scripts/backup-service.ts",
          "--healthcheck",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  blog_backups:
