# /etc/systemd/system/rain-blog.service.d/article-media.conf
[Service]
StateDirectory=rain-blog-uploads
StateDirectoryMode=0700
Environment=MEDIA_STORAGE_PROVIDER=r2
Environment=ARTICLE_MEDIA_DIRECTORY=/var/lib/rain-blog-uploads/images
Environment=ARTICLE_R2_CREDENTIAL_FILE=/var/lib/rain-blog-uploads/r2/credential.json
Environment=ARTICLE_MEDIA_PUBLIC_ORIGIN=https://images.rainonpiano.com
