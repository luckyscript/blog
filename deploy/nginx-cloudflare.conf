# Cloudflare Origin CA: keep the DNS record proxied and use Full (strict).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name rainonpiano.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://rainonpiano.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rainonpiano.com;
    ssl_certificate /etc/rain-blog/tls/rainonpiano.com.pem;
    ssl_certificate_key /etc/rain-blog/tls/rainonpiano.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RainBlogSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 9m;
    include /etc/nginx/snippets/rain-blog-performance.conf;

    location / {
        include /etc/nginx/snippets/rain-blog-proxy.conf;
    }
}
