# Include inside the server that proxies the application, before its location / block.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

# Vite fingerprints these asset filenames. Public HTML and admin responses keep their own policies.
location ^~ /_astro/ {
    include /etc/nginx/snippets/rain-blog-proxy.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
