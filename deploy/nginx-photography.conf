# Inside the existing HTTPS server, before location /.
# Original JIANSHAN uploads accept finished photographs up to 100 MB.
location ~ ^/photography/(?:catalog|exif-view|hero-carousel|app|share|studio/(?:turnstile|admin|ai-copy|studio))\.js$ {
    include /etc/nginx/snippets/rain-blog-proxy.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    if ($arg_v ~ "^perf-[0-9]{8}-[0-9]+$") {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

location ^~ /api/admin/photography/ {
    client_max_body_size 101m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
}
