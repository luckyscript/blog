# /etc/systemd/system/rain-blog-moments.service.d/x.conf
[Service]
Environment=MOMENTS_X_ACCOUNTS=rainonpiano,raininpiano
Environment=MOMENTS_X_INTERVAL_SECONDS=3600
Environment=MOMENTS_X_PYTHON=/opt/rain-blog/x-runtime/bin/python
Environment=MOMENTS_X_CREDENTIAL_FILE=/var/lib/rain-blog-moments/x/session.json
Environment=MOMENTS_X_STATE_DIRECTORY=/var/lib/rain-blog-moments/x
Environment=MOMENTS_X_PROXY=http://127.0.0.1:23333
